name: Deploy to GitHub Pages

# Deploy the verified static output, never the legacy repository-root HTML.
# Pages uses the approved workflow-based deployment setting.
# See docs/build-maintenance.md. Do not delete run history or the workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PRs and builds receive no Pages-write or OIDC permissions.
permissions:
  contents: read

# Cancel outdated PR checks, but do not interrupt an active production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit all dependency severities
        run: npm run audit

      - name: Test the build validator
        run: npm run test:build-validation

      - run: npm run build

      - name: Validate production output
        run: npm run validate:build

      - name: Check evidence and next-phase surfaces
        run: npm run test:next-phase

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: dist

  deploy:
    needs: build
    # This also blocks a manual workflow_dispatch from any non-main branch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
